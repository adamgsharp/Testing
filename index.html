<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #eae4d8;
            min-height: 100vh;
        }

        /* ── Control bar ── */
        #controls {
            background: #fff;
            border-bottom: 2px solid #c8a96a;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }

        #controls-title {
            font-family: 'Lora', serif;
            font-size: 18px;
            color: #3d2b1f;
            white-space: nowrap;
        }

        #tree-name-input {
            border: 1.5px solid #c8a96a;
            border-radius: 5px;
            padding: 6px 10px;
            font-family: 'Lora', serif;
            font-size: 15px;
            color: #3d2b1f;
            width: 190px;
            background: #fffdf8;
        }
        #tree-name-input:focus { outline: none; border-color: #5a8a3b; }

        .spacer { flex: 1; }

        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Open Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .btn:active { transform: scale(.97); }
        .btn-green  { background: #5a8a3b; color: #fff; }
        .btn-green:hover { background: #4a7a2b; }
        .btn-brown  { background: #8a6030; color: #fff; }
        .btn-brown:hover { background: #7a5020; }
        .btn-dark   { background: #3d2b1f; color: #fff; }
        .btn-dark:hover { background: #2d1b0f; }
        .btn-cancel { background: #e0d5c0; color: #3d2b1f; }
        .btn-cancel:hover { background: #d0c5b0; }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-danger:hover { background: #a93226; }

        /* ── Tree wrapper ── */
        #tree-wrapper {
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        #tree-container {
            background: #ffffff;
            width: 816px;
            min-height: 1056px;
            position: relative;
            box-shadow: 0 6px 30px rgba(0,0,0,.2);
            overflow: visible;
        }

        #tree-svg {
            display: block;
            width: 816px;
        }

        /* ── Empty state ── */
        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #b09878;
            pointer-events: none;
        }
        #empty-state h2 {
            font-family: 'Lora', serif;
            font-size: 22px;
            margin-bottom: 8px;
        }
        #empty-state p { font-size: 14px; }

        /* ── Modals ── */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-backdrop.open { display: flex; }

        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            width: 420px;
            max-width: 94vw;
            box-shadow: 0 10px 50px rgba(0,0,0,.3);
        }
        .modal h2 {
            font-family: 'Lora', serif;
            color: #3d2b1f;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0e8d8;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #6a5040;
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            border: 1.5px solid #d0c0a0;
            border-radius: 6px;
            padding: 8px 11px;
            font-size: 14px;
            color: #3d2b1f;
            font-family: 'Open Sans', sans-serif;
            background: #fffdf8;
        }
        .form-group input:focus,
        .form-group select:focus { outline: none; border-color: #5a8a3b; }

        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        /* ── Context menu ── */
        #context-menu {
            position: fixed;
            background: #fff;
            border: 1px solid #d0c0a0;
            border-radius: 8px;
            padding: 5px 0;
            box-shadow: 0 4px 18px rgba(0,0,0,.16);
            z-index: 300;
            display: none;
            min-width: 150px;
        }
        #context-menu.open { display: block; }
        .ctx-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #3d2b1f;
        }
        .ctx-item:hover { background: #f5f0e8; }
        .ctx-item.danger { color: #c0392b; }

        /* ── Legend ── */
        #legend {
            display: flex;
            gap: 16px;
            padding: 8px 20px;
            font-size: 12px;
            color: #8a7060;
            background: #f8f4ec;
            border-top: 1px solid #e0d5c0;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 2px; }

        /* ── Print ── */
        @media print {
            @page { size: letter portrait; margin: 0.4in; }
            body { background: white !important; }
            #controls, #legend { display: none !important; }
            #tree-wrapper { padding: 0 !important; display: block !important; }
            #tree-container {
                width: 100% !important;
                box-shadow: none !important;
                min-height: auto !important;
            }
            #tree-svg { width: 100% !important; }
            .modal-backdrop, #context-menu { display: none !important; }
        }
    </style>
</head>
<body>

<!-- ── Controls ── -->
<div id="controls">
    <span id="controls-title">Family Tree</span>
    <input id="tree-name-input" type="text" placeholder="Enter family name…" oninput="updateTreeName(this.value)">
    <div class="spacer"></div>
    <button class="btn btn-green"  onclick="openAddPersonModal()">+ Add Person</button>
    <button class="btn btn-brown"  onclick="openAddRelationshipModal()">+ Add Relationship</button>
    <button class="btn btn-dark"   onclick="window.print()">Print</button>
</div>

<!-- ── Tree canvas ── -->
<div id="tree-wrapper">
    <div id="tree-container">
        <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="empty-state">
            <h2>Your Family Tree</h2>
            <p>Click <strong>+ Add Person</strong> to get started</p>
        </div>
    </div>
</div>

<!-- ── Legend ── -->
<div id="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#b0c8f0;border:1.5px solid #6a90c8;"></span> Male</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f5c8dc;border:1.5px solid #c87090;"></span> Female</span>
    <span class="legend-item"><span class="legend-dot" style="background:#faf6f0;border:1.5px solid #c8a96a;"></span> Unspecified</span>
    <span style="margin-left:8px;">Click a card to edit &nbsp;|&nbsp; Right-click to delete</span>
</div>

<!-- ── Add / Edit Person Modal ── -->
<div class="modal-backdrop" id="add-person-modal">
    <div class="modal">
        <h2 id="person-modal-title">Add Person</h2>
        <div class="form-group">
            <label>Full Name *</label>
            <input id="p-name" type="text" placeholder="e.g. Jane Marie Smith">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Birth Year</label>
                <input id="p-birth" type="number" placeholder="e.g. 1942" min="1" max="2099">
            </div>
            <div class="form-group">
                <label>Death Year</label>
                <input id="p-death" type="number" placeholder="leave blank if living" min="1" max="2099">
            </div>
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select id="p-gender">
                <option value="">Prefer not to say / other</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div class="form-group">
            <label>Notes (optional)</label>
            <input id="p-notes" type="text" placeholder="e.g. Hometown, occupation…">
        </div>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModals()">Cancel</button>
            <button class="btn btn-green" onclick="savePerson()">Save</button>
        </div>
    </div>
</div>

<!-- ── Add Relationship Modal ── -->
<div class="modal-backdrop" id="add-rel-modal">
    <div class="modal">
        <h2>Add Relationship</h2>
        <div class="form-group">
            <label>Type</label>
            <select id="r-type" onchange="onRelTypeChange()">
                <option value="spouse">Spouse / Partner</option>
                <option value="parent">Parent &rarr; Child</option>
            </select>
        </div>
        <div class="form-group">
            <label id="r-label1">Person 1</label>
            <select id="r-p1"></select>
        </div>
        <div class="form-group">
            <label id="r-label2">Person 2</label>
            <select id="r-p2"></select>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModals()">Cancel</button>
            <button class="btn btn-brown" onclick="saveRelationship()">Add</button>
        </div>
    </div>
</div>

<!-- ── Context Menu ── -->
<div id="context-menu">
    <div class="ctx-item" id="ctx-edit">Edit Person</div>
    <div class="ctx-item danger" id="ctx-delete">Delete Person</div>
</div>

<script>
// ═══════════════════════════════════════════════════════
let state = { treeName: '', people: [], relationships: [] };
let editingId = null;
let ctxId = null;

function persist() { localStorage.setItem('ft2', JSON.stringify(state)); }

function loadSaved() {
    try {
        const s = localStorage.getItem('ft2');
        if (s) {
            state = JSON.parse(s);
            document.getElementById('tree-name-input').value = state.treeName || '';
        }
    } catch(e) {}
}

function updateTreeName(v) { state.treeName = v; persist(); render(); }

function closeModals() {
    document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
    editingId = null;
    ['p-name','p-birth','p-death','p-notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('p-gender').value = '';
}

function openAddPersonModal() {
    editingId = null;
    document.getElementById('person-modal-title').textContent = 'Add Person';
    document.getElementById('add-person-modal').classList.add('open');
    setTimeout(() => document.getElementById('p-name').focus(), 50);
}

function openEditPersonModal(id) {
    const p = state.people.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('person-modal-title').textContent = 'Edit Person';
    document.getElementById('p-name').value  = p.name  || '';
    document.getElementById('p-birth').value = p.birth || '';
    document.getElementById('p-death').value = p.death || '';
    document.getElementById('p-gender').value = p.gender || '';
    document.getElementById('p-notes').value  = p.notes || '';
    document.getElementById('add-person-modal').classList.add('open');
    setTimeout(() => document.getElementById('p-name').focus(), 50);
}

function openAddRelationshipModal() {
    if (state.people.length < 2) { alert('Add at least two people first.'); return; }
    fillPersonSelects();
    onRelTypeChange();
    document.getElementById('add-rel-modal').classList.add('open');
}

function fillPersonSelects() {
    const sorted = [...state.people].sort((a,b) => a.name.localeCompare(b.name));
    const opts = sorted.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('r-p1').innerHTML = opts;
    document.getElementById('r-p2').innerHTML = opts;
    if (sorted.length >= 2) document.getElementById('r-p2').value = sorted[1].id;
}

function onRelTypeChange() {
    const t = document.getElementById('r-type').value;
    document.getElementById('r-label1').textContent = t === 'spouse' ? 'Partner 1'  : 'Parent';
    document.getElementById('r-label2').textContent = t === 'spouse' ? 'Partner 2'  : 'Child';
}

function savePerson() {
    const name = document.getElementById('p-name').value.trim();
    if (!name) { alert('Name is required.'); return; }
    const data = {
        name,
        birth:  document.getElementById('p-birth').value.trim(),
        death:  document.getElementById('p-death').value.trim(),
        gender: document.getElementById('p-gender').value,
        notes:  document.getElementById('p-notes').value.trim(),
    };
    if (editingId) {
        Object.assign(state.people.find(p => p.id === editingId), data);
    } else {
        state.people.push({ id: 'p' + Date.now(), ...data });
    }
    persist(); closeModals(); render();
}

function saveRelationship() {
    const type = document.getElementById('r-type').value;
    const from = document.getElementById('r-p1').value;
    const to   = document.getElementById('r-p2').value;
    if (from === to) { alert('Please choose two different people.'); return; }
    const dup = state.relationships.some(r =>
        r.type === type && ((r.from === from && r.to === to) || (r.from === to && r.to === from))
    );
    if (dup) { alert('That relationship already exists.'); return; }
    state.relationships.push({ id: 'r' + Date.now(), type, from, to });
    persist(); closeModals(); render();
}

function deletePerson(id) {
    if (!confirm('Remove this person and all their relationships?')) return;
    state.people        = state.people.filter(p => p.id !== id);
    state.relationships = state.relationships.filter(r => r.from !== id && r.to !== id);
    persist(); render();
}

const CW = 128, CH = 62, CGAP = 44, HGAP = 18, VGAP = 88;

function buildMaps() {
    const spouseOf    = new Map();
    const childrenOf  = new Map();
    const parentsOf   = new Map();
    for (const r of state.relationships) {
        if (r.type === 'spouse') {
            if (!spouseOf.has(r.from)) spouseOf.set(r.from, r.to);
            if (!spouseOf.has(r.to))   spouseOf.set(r.to, r.from);
        } else {
            if (!childrenOf.has(r.from)) childrenOf.set(r.from, new Set());
            childrenOf.get(r.from).add(r.to);
            if (!parentsOf.has(r.to)) parentsOf.set(r.to, new Set());
            parentsOf.get(r.to).add(r.from);
        }
    }
    return { spouseOf, childrenOf, parentsOf };
}

function coupleKids(unit, childrenOf) {
    const s = new Set();
    for (const id of unit) for (const cid of (childrenOf.get(id) || [])) s.add(cid);
    return [...s];
}

function getUnit(id, spouseOf) {
    const s = spouseOf.get(id);
    return s ? [id, s] : [id];
}

function unitWidth(unit, spouseOf, childrenOf, memo = new Map()) {
    const key = unit.join(',');
    if (memo.has(key)) return memo.get(key);
    const selfW = unit.length === 2 ? CW * 2 + CGAP + HGAP : CW + HGAP;
    const kids  = coupleKids(unit, childrenOf);
    let kidW = 0;
    const seen = new Set();
    for (const cid of kids) {
        if (seen.has(cid)) continue;
        const cu = getUnit(cid, spouseOf);
        cu.forEach(x => seen.add(x));
        kidW += unitWidth(cu, spouseOf, childrenOf, memo);
    }
    const result = Math.max(selfW, kidW);
    memo.set(key, result);
    return result;
}

function computeLayout() {
    const positions = new Map();
    const { spouseOf, childrenOf, parentsOf } = buildMaps();
    const memo = new Map();
    const laid = new Set();

    function placeUnit(unit, cx, y) {
        if (unit.some(x => laid.has(x))) return;
        unit.forEach(x => laid.add(x));
        if (unit.length === 2) {
            positions.set(unit[0], { x: cx - CGAP/2 - CW, y, w: CW, h: CH });
            positions.set(unit[1], { x: cx + CGAP/2,       y, w: CW, h: CH });
        } else {
            positions.set(unit[0], { x: cx - CW/2, y, w: CW, h: CH });
        }
        const kids = coupleKids(unit, childrenOf);
        if (!kids.length) return;
        const totalW = unitWidth(unit, spouseOf, childrenOf, memo);
        let lx = cx - totalW / 2;
        const seen = new Set();
        for (const cid of kids) {
            if (seen.has(cid)) continue;
            const cu = getUnit(cid, spouseOf);
            cu.forEach(x => seen.add(x));
            const w = unitWidth(cu, spouseOf, childrenOf, memo);
            placeUnit(cu, lx + w / 2, y + CH + VGAP);
            lx += w;
        }
    }

    const roots = state.people
        .filter(p => !parentsOf.has(p.id) || !parentsOf.get(p.id).size)
        .map(p => p.id);
    const rootUnits = [];
    const seenR = new Set();
    for (const id of roots) {
        if (seenR.has(id)) continue;
        seenR.add(id);
        const u = getUnit(id, spouseOf);
        u.forEach(x => seenR.add(x));
        rootUnits.push(u);
    }

    const totalRootW = rootUnits.reduce((s, u) => s + unitWidth(u, spouseOf, childrenOf, memo), 0);
    let lx = 408 - totalRootW / 2;
    for (const u of rootUnits) {
        const w = unitWidth(u, spouseOf, childrenOf, memo);
        placeUnit(u, lx + w / 2, 80);
        lx += w;
    }

    let ox = 60, oy = 80;
    for (const p of state.people) {
        if (!positions.has(p.id)) {
            positions.set(p.id, { x: ox, y: oy, w: CW, h: CH });
            ox += CW + HGAP;
            if (ox > 620) { ox = 60; oy += CH + VGAP; }
        }
    }

    return { positions, spouseOf, childrenOf, parentsOf };
}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}) {
    const e = document.createElementNS(NS, tag);
    for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
}
function txt(content, attrs = {}) {
    const t = el('text', attrs);
    t.textContent = content;
    return t;
}

function vineCornerGroup(transform) {
    const g = el('g', { transform, opacity: '0.82' });
    g.appendChild(el('path', {
        d: 'M 5 108 C 22 92, 38 68, 58 46 C 78 24, 98 10, 112 4',
        stroke: '#6a9450', fill: 'none', 'stroke-width': '2.4', 'stroke-linecap': 'round'
    }));
    g.appendChild(el('path', {
        d: 'M 32 72 C 24 56, 14 42, 18 26',
        stroke: '#6a9450', fill: 'none', 'stroke-width': '1.6', 'stroke-linecap': 'round'
    }));
    g.appendChild(el('path', {
        d: 'M 66 44 C 72 28, 62 14, 72 4',
        stroke: '#6a9450', fill: 'none', 'stroke-width': '1.6', 'stroke-linecap': 'round'
    }));
    g.appendChild(el('path', {
        d: 'M 45 58 C 52 50, 48 40, 54 34',
        stroke: '#6a9450', fill: 'none', 'stroke-width': '1', 'stroke-linecap': 'round', opacity: '0.6'
    }));
    g.appendChild(el('path', {
        d: 'M 15 85 C 8 78, 10 66, 6 60',
        stroke: '#6a9450', fill: 'none', 'stroke-width': '1', 'stroke-linecap': 'round', opacity: '0.6'
    }));
    const leaves = [
        { cx: 56, cy: 46, rx: 11, ry: 5.5, rot: -45, fill: '#a0c878' },
        { cx: 86, cy: 22, rx: 10, ry: 5,   rot: -32, fill: '#88b860' },
        { cx: 17, cy: 26, rx: 9,  ry: 4.5, rot: -68, fill: '#a0c878' },
        { cx: 26, cy: 37, rx: 8,  ry: 4,   rot: -40, fill: '#c0d898' },
        { cx: 72, cy: 4,  rx: 9,  ry: 4.5, rot:  22, fill: '#88b860' },
        { cx: 63, cy: 15, rx: 8,  ry: 4,   rot:  52, fill: '#a0c878' },
        { cx: 54, cy: 34, rx: 7,  ry: 3.5, rot: -20, fill: '#c0d898' },
    ];
    for (const l of leaves) {
        g.appendChild(el('ellipse', {
            cx: l.cx, cy: l.cy, rx: l.rx, ry: l.ry,
            fill: l.fill, transform: `rotate(${l.rot} ${l.cx} ${l.cy})`
        }));
    }
    for (const [bx, by] of [[112,4],[5,108],[95,3]]) {
        g.appendChild(el('circle', { cx: bx, cy: by, r: '2.5', fill: '#c8a060', opacity: '0.7' }));
    }
    return g;
}

function render() {
    const svg        = document.getElementById('tree-svg');
    const emptyState = document.getElementById('empty-state');
    svg.innerHTML = '';

    if (!state.people.length) {
        svg.setAttribute('viewBox', '0 0 816 1056');
        svg.style.height = '1056px';
        document.getElementById('tree-container').style.minHeight = '1056px';
        drawShell(svg, 1056);
        emptyState.style.display = 'block';
        return;
    }
    emptyState.style.display = 'none';

    const { positions, spouseOf, childrenOf } = computeLayout();
    let maxY = 0;
    for (const p of positions.values()) maxY = Math.max(maxY, p.y + p.h);
    const svgH = Math.max(1056, maxY + 100);

    svg.setAttribute('viewBox', `0 0 816 ${svgH}`);
    svg.style.height = svgH + 'px';
    document.getElementById('tree-container').style.minHeight = svgH + 'px';

    drawShell(svg, svgH);
    drawConnections(svg, positions, spouseOf, childrenOf);
    for (const p of state.people) {
        const pos = positions.get(p.id);
        if (pos) drawCard(svg, p, pos);
    }
}

function drawShell(svg, svgH) {
    const defs = el('defs');
    defs.innerHTML = `
        <filter id="cs" x="-8%" y="-8%" width="118%" height="118%">
            <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#00000018"/>
        </filter>
    `;
    svg.appendChild(defs);
    svg.appendChild(el('rect', {
        x: '10', y: '10', width: '796', height: svgH - 20,
        rx: '4', fill: 'none', stroke: '#d4b878', 'stroke-width': '1.5'
    }));
    svg.appendChild(el('rect', {
        x: '14', y: '14', width: '788', height: svgH - 28,
        rx: '3', fill: 'none', stroke: '#e8d4a0', 'stroke-width': '0.7'
    }));
    svg.appendChild(vineCornerGroup('translate(0,0)'));
    svg.appendChild(vineCornerGroup(`translate(816,0) scale(-1,1)`));
    svg.appendChild(vineCornerGroup(`translate(0,${svgH}) scale(1,-1)`));
    svg.appendChild(vineCornerGroup(`translate(816,${svgH}) scale(-1,-1)`));

    const titleName = state.treeName || 'Family Tree';
    const tg = el('g');
    tg.appendChild(el('line', { x1:'55', y1:'38', x2:'200', y2:'38', stroke:'#c8a060', 'stroke-width':'1.2' }));
    tg.appendChild(el('line', { x1:'616', y1:'38', x2:'761', y2:'38', stroke:'#c8a060', 'stroke-width':'1.2' }));
    tg.appendChild(el('polygon', { points:'408,30 413,36 408,42 403,36', fill:'#c8a060', opacity:'0.6' }));
    tg.appendChild(txt(titleName, {
        x: '408', y: '44', 'text-anchor': 'middle',
        'font-family': 'Lora, Georgia, serif', 'font-size': '22',
        'font-weight': '600', fill: '#3d2b1f'
    }));
    svg.appendChild(tg);
}

function drawConnections(svg, positions, spouseOf, childrenOf) {
    const g = el('g');
    const drawnSpouses = new Set();
    const drawnParents = new Set();

    for (const p of state.people) {
        const sid = spouseOf.get(p.id);
        if (!sid) continue;
        const key = [p.id, sid].sort().join('~');
        if (drawnSpouses.has(key)) continue;
        drawnSpouses.add(key);
        const pa = positions.get(p.id), pb = positions.get(sid);
        if (!pa || !pb) continue;
        const lx = Math.min(pa.x + pa.w, pb.x + pb.w);
        const rx = Math.max(pa.x, pb.x);
        const y  = Math.min(pa.y, pb.y) + CH / 2;
        g.appendChild(el('line', { x1:lx, y1:y, x2:rx, y2:y, stroke:'#c8a060', 'stroke-width':'1.8', 'stroke-dasharray':'5 3' }));
        g.appendChild(txt('♥', { x:(lx+rx)/2, y:y+5, 'text-anchor':'middle', 'font-size':'12', fill:'#c07878' }));
    }

    for (const p of state.people) {
        const kids = childrenOf.get(p.id);
        if (!kids || !kids.size) continue;
        if (drawnParents.has(p.id)) continue;
        const sid = spouseOf.get(p.id);
        drawnParents.add(p.id);
        if (sid) drawnParents.add(sid);
        const allKids = new Set([...kids]);
        if (sid) (childrenOf.get(sid) || []).forEach(c => allKids.add(c));
        const pa  = positions.get(p.id);
        const pb  = sid ? positions.get(sid) : null;
        if (!pa) continue;
        const parentMidX = pb ? (pa.x + pa.w/2 + pb.x + pb.w/2) / 2 : pa.x + pa.w/2;
        const parentBotY = Math.max(pa.y, pb ? pb.y : pa.y) + CH;
        const kidIds  = [...allKids].filter(c => positions.has(c));
        if (!kidIds.length) continue;
        const kidMidXs = kidIds.map(c => positions.get(c).x + CW/2);
        const kidTopY  = positions.get(kidIds[0]).y;
        const barY     = parentBotY + VGAP * 0.45;
        g.appendChild(el('line', { x1:parentMidX, y1:parentBotY, x2:parentMidX, y2:barY, stroke:'#8a6030', 'stroke-width':'1.8', 'stroke-linecap':'round' }));
        if (kidIds.length > 1) {
            const minX = Math.min(...kidMidXs), maxX = Math.max(...kidMidXs);
            g.appendChild(el('line', { x1:minX, y1:barY, x2:maxX, y2:barY, stroke:'#8a6030', 'stroke-width':'1.8', 'stroke-linecap':'round' }));
        }
        for (const cid of kidIds) {
            const cmx = positions.get(cid).x + CW/2;
            g.appendChild(el('line', { x1:cmx, y1:barY, x2:cmx, y2:kidTopY, stroke:'#8a6030', 'stroke-width':'1.8', 'stroke-linecap':'round' }));
            g.appendChild(el('circle', { cx:cmx, cy:barY, r:'3', fill:'#8a6030' }));
        }
    }
    svg.appendChild(g);
}

function drawCard(svg, person, pos) {
    const g = el('g', { 'data-id': person.id });
    g.style.cursor = 'pointer';
    const palette = {
        male:   { bg:'#ddeafc', border:'#6a8ec8', hdr:'#5a7eb8', text:'#1a3060' },
        female: { bg:'#fce8f0', border:'#c87090', hdr:'#b86080', text:'#60102a' },
        '':     { bg:'#faf6f0', border:'#c8a060', hdr:'#b89050', text:'#3d2b1f' },
    };
    const c = palette[person.gender] || palette[''];
    g.appendChild(el('rect', { x:pos.x+2, y:pos.y+3, width:pos.w, height:pos.h, rx:'8', fill:'#00000012' }));
    g.appendChild(el('rect', { x:pos.x, y:pos.y, width:pos.w, height:pos.h, rx:'8', fill:c.bg, stroke:c.border, 'stroke-width':'1.5', filter:'url(#cs)' }));
    g.appendChild(el('rect', { x:pos.x, y:pos.y, width:pos.w, height:'20', rx:'8', fill:c.hdr }));
    g.appendChild(el('rect', { x:pos.x, y:pos.y+12, width:pos.w, height:'8', fill:c.hdr }));

    const words = person.name.split(' ');
    let line1 = '', line2 = '';
    if (person.name.length <= 16) {
        line1 = person.name;
    } else {
        const mid = Math.ceil(words.length / 2);
        line1 = words.slice(0, mid).join(' ');
        line2 = words.slice(mid).join(' ');
    }
    line1 = trunc(line1, 17); line2 = trunc(line2, 17);

    if (line2) {
        g.appendChild(txt(line1, { x:pos.x+pos.w/2, y:pos.y+12, 'text-anchor':'middle', 'font-family':'Lora, Georgia, serif', 'font-size':'9.5', 'font-weight':'600', fill:'#fff' }));
        g.appendChild(txt(line2, { x:pos.x+pos.w/2, y:pos.y+22, 'text-anchor':'middle', 'font-family':'Lora, Georgia, serif', 'font-size':'9', fill:'#fff' }));
    } else {
        g.appendChild(txt(line1, { x:pos.x+pos.w/2, y:pos.y+14, 'text-anchor':'middle', 'font-family':'Lora, Georgia, serif', 'font-size':'10.5', 'font-weight':'600', fill:'#fff' }));
    }

    const dateStr = fmtDates(person.birth, person.death);
    if (dateStr) {
        g.appendChild(txt(dateStr, { x:pos.x+pos.w/2, y:pos.y+40, 'text-anchor':'middle', 'font-family':'Open Sans, Arial, sans-serif', 'font-size':'9.5', fill:c.text }));
    }
    if (person.notes) {
        g.appendChild(txt(trunc(person.notes, 20), { x:pos.x+pos.w/2, y:pos.y+54, 'text-anchor':'middle', 'font-family':'Open Sans, Arial, sans-serif', 'font-size':'8', fill:c.text, opacity:'0.7', 'font-style':'italic' }));
    }

    g.addEventListener('click', () => openEditPersonModal(person.id));
    g.addEventListener('contextmenu', e => {
        e.preventDefault();
        ctxId = person.id;
        const menu = document.getElementById('context-menu');
        menu.style.left = e.clientX + 'px';
        menu.style.top  = e.clientY + 'px';
        menu.classList.add('open');
    });
    svg.appendChild(g);
}

function trunc(s, n) { if (!s) return ''; return s.length <= n ? s : s.slice(0, n-1) + '…'; }
function fmtDates(b, d) {
    if (!b && !d) return '';
    if (b && d) return `${b} – ${d}`;
    if (b) return `b. ${b}`;
    return `d. ${d}`;
}

document.querySelectorAll('.modal-backdrop').forEach(bd => {
    bd.addEventListener('click', e => { if (e.target === bd) closeModals(); });
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModals();
    if (e.key === 'Enter') {
        if (document.getElementById('add-person-modal').classList.contains('open')) savePerson();
        if (document.getElementById('add-rel-modal').classList.contains('open')) saveRelationship();
    }
});
document.addEventListener('click', () => { document.getElementById('context-menu').classList.remove('open'); });
document.getElementById('ctx-edit').onclick   = () => { openEditPersonModal(ctxId); };
document.getElementById('ctx-delete').onclick = () => { deletePerson(ctxId); };

loadSaved();
render();
</script>
