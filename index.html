<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYT Bestseller Recommender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 22px 40px;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #ccc;
        }

        .logo span {
            color: #e63946;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 860px;
            padding: 64px 24px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1.2;
            color: #fff;
            margin-bottom: 18px;
        }

        h1 em {
            font-style: italic;
            color: #e63946;
        }

        .subtitle {
            color: #777;
            font-size: 1rem;
            font-weight: 300;
            max-width: 420px;
            margin: 0 auto 36px;
            line-height: 1.65;
        }

        .btn-main {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 15px 44px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            border-radius: 4px;
        }

        .btn-main:hover {
            background: #c1121f;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(230, 57, 70, 0.35);
        }

        .btn-main:active {
            transform: translateY(0);
            box-shadow: none;
        }

        /* Book Card */
        .book-card {
            width: 100%;
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            padding: 40px;
            display: none;
        }

        .book-card.visible {
            display: flex;
            gap: 40px;
            animation: fadeUp 0.45s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-cover {
            flex-shrink: 0;
            width: 155px;
        }

        .book-cover img {
            width: 155px;
            height: 232px;
            object-fit: cover;
            border-radius: 3px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            display: block;
        }

        .cover-placeholder {
            width: 155px;
            height: 232px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 3px;
            display: none;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.75rem;
            text-align: center;
            padding: 12px;
            line-height: 1.4;
        }

        .book-info {
            flex: 1;
            min-width: 0;
        }

        .book-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 3px;
        }

        .badge-nyt {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #2a2a2a;
        }

        .badge-category {
            color: #e63946;
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.2);
        }

        .badge-year {
            color: #666;
            background: #111;
            border: 1px solid #222;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            color: #fff;
            line-height: 1.25;
            margin-bottom: 10px;
        }

        .book-author {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 22px;
        }

        .divider {
            height: 1px;
            background: #1e1e1e;
            margin-bottom: 20px;
        }

        .book-description {
            font-size: 0.92rem;
            color: #999;
            line-height: 1.75;
            margin-bottom: 28px;
        }

        .book-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-amazon {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 10px 22px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-amazon:hover {
            background: #c1121f;
        }

        .btn-another {
            background: transparent;
            color: #ccc;
            border: 1px solid #2a2a2a;
            padding: 10px 22px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            border-radius: 4px;
        }

        .btn-another:hover {
            border-color: #444;
            background: #1a1a1a;
        }

        footer {
            padding: 24px;
            text-align: center;
            color: #333;
            font-size: 0.78rem;
            border-top: 1px solid #141414;
            width: 100%;
            margin-top: auto;
        }

        @media (max-width: 580px) {
            main {
                padding: 48px 16px 32px;
            }

            .book-card.visible {
                flex-direction: column;
                align-items: center;
                padding: 28px 20px;
                gap: 28px;
            }

            .book-cover {
                width: 140px;
            }

            .book-cover img,
            .cover-placeholder {
                width: 140px;
                height: 210px;
            }

            .book-info {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">NYT <span>Bestseller</span> Recommender</div>
    </header>

    <main>
        <div class="hero">
            <h1>Discover Your Next<br><em>Great Read</em></h1>
            <p class="subtitle">Get a random pick from New York Times bestselling books of the last five years.</p>
            <button class="btn-main" onclick="recommend()">Recommend a Book</button>
        </div>

        <div class="book-card" id="bookCard">
            <div class="book-cover">
                <img id="coverImg" src="" alt="Book cover" onerror="showPlaceholder()">
                <div class="cover-placeholder" id="coverPlaceholder">Cover not available</div>
            </div>
            <div class="book-info">
                <div class="book-meta">
                    <span class="badge badge-nyt">&#9733; NYT Bestseller</span>
                    <span class="badge badge-category" id="badgeCategory"></span>
                    <span class="badge badge-year" id="badgeYear"></span>
                </div>
                <h2 class="book-title" id="bookTitle"></h2>
                <div class="book-author" id="bookAuthor"></div>
                <div class="divider"></div>
                <p class="book-description" id="bookDescription"></p>
                <div class="book-actions">
                    <a id="amazonLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-amazon">Find on Amazon</a>
                    <button class="btn-another" onclick="recommend()">Try Another &rarr;</button>
                </div>
            </div>
        </div>
    </main>

    <footer>Books drawn from the New York Times Bestseller lists &bull; 2021&ndash;2026</footer>

    <script>
        const books = [
            // FICTION
            {
                title: "The Four Winds",
                author: "Kristin Hannah",
                year: 2021,
                category: "Fiction",
                isbn: "9781250178602",
                description: "From the author of The Nightingale comes a powerful American epic set during the Great Depression — a story of love, survival, and the resilience of the human spirit when a mother is forced to choose between saving herself and saving her children."
            },
            {
                title: "Project Hail Mary",
                author: "Andy Weir",
                year: 2021,
                category: "Fiction",
                isbn: "9780593135204",
                description: "A lone astronaut wakes up millions of miles from home with no memory of how he got there. He must piece together the truth — and save Earth from an extinction-level threat — before it's too late."
            },
            {
                title: "Klara and the Sun",
                author: "Kazuo Ishiguro",
                year: 2021,
                category: "Fiction",
                isbn: "9780593311295",
                description: "An Artificial Friend named Klara observes humans from a store window, hoping to be chosen. A luminous novel from the Nobel laureate about what it means to love — and what it means to be human."
            },
            {
                title: "Malibu Rising",
                author: "Taylor Jenkins Reid",
                year: 2021,
                category: "Fiction",
                isbn: "9781250764799",
                description: "Four famous siblings host a legendary end-of-summer party at their Malibu beach house. Over one wild night, secrets unravel and lives are changed forever."
            },
            {
                title: "The Midnight Library",
                author: "Matt Haig",
                year: 2021,
                category: "Fiction",
                isbn: "9780525559474",
                description: "Between life and death there is a library where every book is a different life you could have lived. Nora Seed must decide which life is truly worth living."
            },
            {
                title: "Apples Never Fall",
                author: "Liane Moriarty",
                year: 2021,
                category: "Fiction",
                isbn: "9781250220790",
                description: "The Delaney family seems perfect — a retired tennis-coaching couple, four grown children. Then their mother disappears. Which one of them could have done it?"
            },
            {
                title: "The Judge's List",
                author: "John Grisham",
                year: 2021,
                category: "Fiction",
                isbn: "9780385547642",
                description: "A complaint investigator for a federal judicial oversight board secretly investigates a sitting federal judge she suspects of murder — a race against time and power."
            },
            {
                title: "Tomorrow, and Tomorrow, and Tomorrow",
                author: "Gabrielle Zevin",
                year: 2022,
                category: "Fiction",
                isbn: "9780593321201",
                description: "A sweeping novel about friendship, creativity, and love set against the world of video game design — spanning three decades and exploring what it means to build something that matters."
            },
            {
                title: "Lessons in Chemistry",
                author: "Bonnie Garmus",
                year: 2022,
                category: "Fiction",
                isbn: "9780385547345",
                description: "A female chemist in 1960s California becomes an unlikely TV cooking show star. Her no-nonsense approach to science inspires a nation of housewives to think of themselves as so much more."
            },
            {
                title: "Demon Copperhead",
                author: "Barbara Kingsolver",
                year: 2022,
                category: "Fiction",
                isbn: "9780063141292",
                description: "A Pulitzer Prize–winning retelling of David Copperfield set in Appalachia, following a boy born to poverty in the opioid era — a devastating, compassionate portrait of America left behind."
            },
            {
                title: "Book Lovers",
                author: "Emily Henry",
                year: 2022,
                category: "Fiction",
                isbn: "9780593334836",
                description: "A cutthroat literary agent and a book editor keep crossing paths in a small North Carolina town. A witty, heartfelt rom-com for people who love books and the complicated people obsessed with them."
            },
            {
                title: "Babel",
                author: "R.F. Kuang",
                year: 2022,
                category: "Fiction",
                isbn: "9780063021426",
                description: "A dark academic fantasy set in 1830s Oxford, where magic is powered by the untranslatable gaps between languages — and a brilliant student must choose between his adopted country and his conscience."
            },
            {
                title: "Fairy Tale",
                author: "Stephen King",
                year: 2022,
                category: "Fiction",
                isbn: "9781668002179",
                description: "A teenage boy inherits an old shed — and a key to a parallel world where the remnants of good and evil are locked in a timeless battle. A masterful return to epic fantasy from the king of horror."
            },
            {
                title: "The Covenant of Water",
                author: "Abraham Verghese",
                year: 2023,
                category: "Fiction",
                isbn: "9780802162175",
                description: "Spanning three generations of a family in South India, this epic novel traces an inherited condition, the doctors who try to help them, and the mystery of love that flows through time like water."
            },
            {
                title: "Happy Place",
                author: "Emily Henry",
                year: 2023,
                category: "Fiction",
                isbn: "9780593441282",
                description: "Two people who secretly broke up months ago must pretend to still be together at their annual friend group reunion. Trapped in their shared happy place, the lines between pretend and real begin to blur."
            },
            {
                title: "Fourth Wing",
                author: "Rebecca Yarros",
                year: 2023,
                category: "Fiction",
                isbn: "9781649374042",
                description: "At a war college where dragons choose their riders, a young woman expected to fail finds herself drawn to the most dangerous man on campus — and to an extraordinary dragon no one else could bond with."
            },
            {
                title: "Yellowface",
                author: "R.F. Kuang",
                year: 2023,
                category: "Fiction",
                isbn: "9780063250833",
                description: "After her Chinese American friend dies in a freak accident, a white author steals her unpublished manuscript and publishes it as her own. A razor-sharp satire of race, privilege, and the publishing industry."
            },
            {
                title: "Holly",
                author: "Stephen King",
                year: 2023,
                category: "Fiction",
                isbn: "9781668016060",
                description: "Holly Gibney — one of Stephen King's most beloved characters — returns for her most dangerous and personal case yet, a chilling standalone thriller of dark obsession and unlikely heroism."
            },
            {
                title: "The Women",
                author: "Kristin Hannah",
                year: 2024,
                category: "Fiction",
                isbn: "9780312577230",
                description: "A young nurse follows her brother to serve in Vietnam, only to discover that the true battle begins when she comes home — an unforgettable story of women who were warriors and what America owed them."
            },
            {
                title: "James",
                author: "Percival Everett",
                year: 2024,
                category: "Fiction",
                isbn: "9780385550369",
                description: "A Pulitzer Prize–winning reimagining of Adventures of Huckleberry Finn told from the perspective of the enslaved Jim — a powerful, funny, and deeply moving reinvention of an American classic."
            },
            {
                title: "Intermezzo",
                author: "Sally Rooney",
                year: 2024,
                category: "Fiction",
                isbn: "9780374610647",
                description: "Two grieving brothers navigate love, loss, and complicated relationships in the year following their father's death — from the author of Normal People, in her most ambitious novel yet."
            },
            {
                title: "Funny Story",
                author: "Emily Henry",
                year: 2024,
                category: "Fiction",
                isbn: "9780593441275",
                description: "Two strangers, both recently left by their partners for each other, end up as unlikely roommates. What starts as commiseration becomes something neither of them expected."
            },
            {
                title: "Orbital",
                author: "Samantha Harvey",
                year: 2024,
                category: "Fiction",
                isbn: "9780802164230",
                description: "A Booker Prize–winning novel set aboard the International Space Station over a single day, as six astronauts orbit Earth sixteen times and contemplate the fragile, astonishing beauty of the world below."
            },
            // NONFICTION
            {
                title: "The Body Keeps the Score",
                author: "Bessel van der Kolk",
                year: 2021,
                category: "Nonfiction",
                isbn: "9780143127741",
                description: "A pioneering researcher transforms our understanding of trauma and its treatment, revealing how it reshapes body, brain, and mind — and what innovative new treatments offer hope for recovery."
            },
            {
                title: "Atomic Habits",
                author: "James Clear",
                year: 2021,
                category: "Nonfiction",
                isbn: "9780735211292",
                description: "A practical guide to building good habits and breaking bad ones. The tiny changes that seem to make no difference add up to the remarkable results that distinguish successful people."
            },
            {
                title: "Will",
                author: "Will Smith",
                year: 2021,
                category: "Nonfiction",
                isbn: "9781984877789",
                description: "Will Smith opens up about his life and career with uncommon depth and honesty — sharing the lessons, personal struggles, and extraordinary adventures accumulated over a lifetime in entertainment."
            },
            {
                title: "The Storyteller",
                author: "Dave Grohl",
                year: 2021,
                category: "Nonfiction",
                isbn: "9781797113401",
                description: "The Foo Fighters frontman and Nirvana drummer shares remarkable true tales from a life lived at the intersection of music, magic, and the joyous chaos of rock and roll."
            },
            {
                title: "I'm Glad My Mom Died",
                author: "Jennette McCurdy",
                year: 2022,
                category: "Nonfiction",
                isbn: "9781982185824",
                description: "The former iCarly star's raw, darkly funny memoir about her complicated relationship with her mother, her struggle with eating disorders, and her journey toward independence and healing."
            },
            {
                title: "The Light We Carry",
                author: "Michelle Obama",
                year: 2022,
                category: "Nonfiction",
                isbn: "9780593237465",
                description: "The former First Lady shares personal tools and practices she has developed to navigate uncertainty — an intimate look at how she stays grounded, purposeful, and hopeful in turbulent times."
            },
            {
                title: "Finding Me",
                author: "Viola Davis",
                year: 2022,
                category: "Nonfiction",
                isbn: "9780063037328",
                description: "A deeply personal memoir from the acclaimed actress and producer, tracing her extraordinary journey from profound poverty in Rhode Island to the heights of Hollywood and Broadway."
            },
            {
                title: "Spare",
                author: "Prince Harry, The Duke of Sussex",
                year: 2023,
                category: "Nonfiction",
                isbn: "9780593593806",
                description: "A raw, unflinching memoir from Prince Harry — from his turbulent childhood in the Royal Family to his marriage and the dramatic decision to step back from royal duties and forge a new life."
            },
            {
                title: "Outlive",
                author: "Peter Attia, MD",
                year: 2023,
                category: "Nonfiction",
                isbn: "9780593236598",
                description: "A groundbreaking guide to living better and longer — a leading physician lays out a bold new science of longevity, challenging conventional medicine with practical strategies for a healthier life."
            },
            {
                title: "The Wager",
                author: "David Grann",
                year: 2023,
                category: "Nonfiction",
                isbn: "9780385534260",
                description: "In 1741, a British naval ship wrecked on a desolate island off Patagonia. What happened next — mutiny, survival, and a harrowing homecoming — became one of history's most gripping tales of adventure and justice."
            },
            {
                title: "Poverty, by America",
                author: "Matthew Desmond",
                year: 2023,
                category: "Nonfiction",
                isbn: "9780593239919",
                description: "The Pulitzer Prize–winning sociologist argues that America has the resources to eliminate poverty — and that the real question is why we choose not to. A bracing, urgent call to moral action."
            },
            {
                title: "Say Nothing",
                author: "Patrick Radden Keefe",
                year: 2024,
                category: "Nonfiction",
                isbn: "9780385521437",
                description: "A gripping account of the Troubles in Northern Ireland, centered on the unsolved murder of Jean McConville and the lives consumed by violence, ideology, and the long aftermath of a brutal conflict."
            }
        ];

        let lastIndex = -1;

        function showPlaceholder() {
            document.getElementById('coverImg').style.display = 'none';
            document.getElementById('coverPlaceholder').style.display = 'flex';
        }

        function recommend() {
            let idx;
            do {
                idx = Math.floor(Math.random() * books.length);
            } while (idx === lastIndex && books.length > 1);
            lastIndex = idx;

            const book = books[idx];
            const card = document.getElementById('bookCard');

            // Reset animation by removing/re-adding class
            card.classList.remove('visible');
            void card.offsetWidth;

            // Fill in content
            document.getElementById('badgeCategory').textContent = book.category;
            document.getElementById('badgeYear').textContent = book.year;
            document.getElementById('bookTitle').textContent = book.title;
            document.getElementById('bookAuthor').textContent = 'by ' + book.author;
            document.getElementById('bookDescription').textContent = book.description;

            // Cover image from Open Library
            const img = document.getElementById('coverImg');
            const placeholder = document.getElementById('coverPlaceholder');
            img.style.display = 'block';
            placeholder.style.display = 'none';
            img.src = 'https://covers.openlibrary.org/b/isbn/' + book.isbn + '-L.jpg';

            // Amazon search link
            document.getElementById('amazonLink').href =
                'https://www.amazon.com/s?k=' + encodeURIComponent(book.title + ' ' + book.author);

            // Show card
            card.classList.add('visible');

            // Smooth scroll into view
            setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
        }
    </script>
</body>
</html>
